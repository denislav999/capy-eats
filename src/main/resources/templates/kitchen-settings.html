<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Settings · ${kitchen.name} · capyEats|">Settings · capyEats</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/owner.css">
</head>
<body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div th:replace="~{fragments/fragments :: kitchen-header('settings')}"> </div>
    <main id="workspace" class="owner-shell" tabindex="-1">
        <header class="page-heading">
            <div>
                <p class="eyebrow" th:text="${kitchen.name}"></p>
                <h1>Kitchen settings</h1>
            </div>
            <a class="secondary" th:href="@{/kitchen-profile}">View kitchen profile</a>
        </header>

        <form class="paper settings-sheet" th:action="@{/kitchen-settings}" method="post"
              th:object="${kitchenSettingsRequest}" aria-label="Kitchen settings">
            <fieldset class="settings-group">
                <legend>Kitchen details</legend>
                <div class="settings-fields">
                    <div class="field">
                        <label for="setting-name">Kitchen name</label>
                        <input id="setting-name" type="text" th:field="*{name}" required maxlength="100">
                        <p class="note" role="alert" th:errors="*{name}"></p>
                    </div>
                    <div class="field">
                        <label for="setting-delivery">Delivery time (minutes)</label>
                        <input id="setting-delivery" type="number" th:field="*{deliveryTime}" min="5" max="120" step="1">
                        <p class="note" role="alert" th:errors="*{deliveryTime}"></p>
                    </div>
                    <div class="field">
                        <label for="setting-delivery-fee">Delivery fee (€)</label>
                        <input id="setting-delivery-fee" type="number" th:field="*{deliveryFee}" min="0" max="9999.99" step="0.01">
                        <p class="note" role="alert" th:errors="*{deliveryFee}"></p>
                    </div>
                    <div class="field settings-description">
                        <label for="setting-description">Kitchen description</label>
                        <textarea id="setting-description" th:field="*{description}" rows="3" maxlength="150"></textarea>
                        <p class="note" role="alert" th:errors="*{description}"></p>
                    </div>
                </div>
            </fieldset>

            <fieldset class="settings-group">
                <legend>New orders</legend>
                <div class="service-options">
                    <label><input type="radio" th:field="*{open}" value="true"> Accept orders</label>
                    <label><input type="radio" th:field="*{open}" value="false"> Pause orders</label>
                </div>
                <p class="note" role="alert" th:errors="*{open}"></p>
            </fieldset>

            <div class="settings-footer">
                <button type="submit" class="dark-button">Save changes</button>
                <p class="note" role="status" th:if="${settingsMessage}" th:text="${settingsMessage}"></p>
            </div>
        </form>
    </main>
</body>
</html>
