<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - capyEats</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<header class="app-header">
    <div class="container">
        <a th:href="@{/}" class="logo">capyEats</a>
    </div>
</header>

<main class="profile-main">
    <div class="container">
        <!-- Redesigned profile layout with better visual hierarchy -->
        <div class="profile-wrapper">
            <!-- Sidebar -->
            <div th:replace="fragments/fragments::profile-sidebar"></div>

            <!-- Main Content -->
            <div class="profile-content" th:classappend="${profileEditing} ? 'profile-editing' : ''">
                <div class="content-header">
                    <h1>Personal Information</h1>
                    <button type="button" class="btn-edit profile-view-only" id="edit-btn">Edit Profile</button>
                </div>

                <!-- Profile Info -->
                <form class="info-card" th:action="@{/profile}" method="post" th:object="${profileUpdateRequest}">
                    <div class="info-grid">
                        <div class="info-item">
                            <label for="fullName">Full Name</label>
                            <div class="info-value profile-view-only" th:text="${user.fullName != null ? user.fullName : 'None'}">None</div>
                            <div class="profile-edit-only">
                                <input type="text" class="info-input" th:field="*{fullName}" autocomplete="name">
                                <p class="profile-field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                            </div>
                        </div>

                        <div class="info-item">
                            <label for="email">Email Address</label>
                            <div class="info-value profile-view-only" th:text="${user.email}"></div>
                            <div class="profile-edit-only">
                                <input type="email" class="info-input" th:field="*{email}" autocomplete="email">
                                <p class="profile-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                            </div>
                        </div>

                        <div class="info-item">
                            <label for="phoneNumber">Phone Number</label>
                            <div class="info-value profile-view-only" th:text="${user.phoneNumber != null ? user.phoneNumber : 'None'}"></div>
                            <div class="profile-edit-only">
                                <input type="tel" class="info-input" th:field="*{phoneNumber}" autocomplete="tel">
                                <p class="profile-field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
                            </div>
                        </div>

                        <div class="info-item">
                            <label for="username">Username</label>
                            <div class="info-value profile-view-only" th:text="${user.username}"></div>
                            <div class="profile-edit-only">
                                <input type="text" class="info-input" th:field="*{username}" autocomplete="username">
                                <p class="profile-field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="edit-actions profile-edit-only">
                        <button class="btn-save" type="submit">Save Changes</button>
                        <a class="btn-cancel" th:href="@{/profile}">Cancel</a>
                    </div>
                </form>
                <!-- Stats Cards -->
                 <div class="stats-grid" sec:authorize="hasAnyRole('USER','ADMIN')">
                    <div class="stat-card">
                        <div class="stat-icon">📦</div>
                        <div class="stat-info">
                            <div class="stat-value" th:text="${totalOrders}"></div>
                            <div class="stat-label">Total Orders</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💰</div>
                        <div class="stat-info">
                            <div class="stat-value" th:text="${totalSpend}"></div>
                            <div class="stat-label">Total Spent</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⭐</div>
                        <div class="stat-info">
                            <div class="stat-value" th:text="${totalReviews}"></div>
                            <div class="stat-label">Reviews Written</div>
                        </div>
                    </div>
                </div>

                <!-- Saved Addresses -->
                <div class="section-card" sec:authorize="hasAnyRole('USER','ADMIN')">
                    <div class="section-header">
                        <h2>Saved Addresses</h2>
                        <a class="btn-add" th:href="@{/profile/addresses}">+ Add New</a>
                    </div>
                    <div class="address-grid">
                        <div class="address-card" th:each="address : ${user.addresses}">
                            <div class="address-type">
                                <span th:switch="${address.addressType}">
                                    <span th:case="${T(capyeats.address.model.AddressType).HOME}">🏠</span>
                                    <span th:case="${T(capyeats.address.model.AddressType).WORK}">💼</span>
                                    <span th:case="*">📍</span>
                                </span>
                                <span th:text="${address.label}"></span>
                            </div>
                            <div class="address-text">
                                <span th:text="${address.street}"></span>
                                <span th:text="${address.streetNumber}"></span><br>
                                <span th:text="${address.city}"></span>
                                <span th:text="${address.postalCode}"></span>
                            </div>
                            <a class="link-btn" th:href="@{/profile/addresses/{addressId}/edit(addressId=${address.id})}">Edit</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const editButton = document.getElementById('edit-btn');
    editButton.addEventListener('click', () => {
        editButton.closest('.profile-content').classList.add('profile-editing');
        document.getElementById('fullName').focus();
    });
</script>
</body>
</html>
