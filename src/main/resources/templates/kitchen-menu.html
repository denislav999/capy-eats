<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu · Sofia Bowls · capyEats</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/owner.css">
</head>
<body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div th:replace="~{fragments/fragments :: kitchen-header('menu')}"> </div>
    <main id="workspace" class="owner-shell" tabindex="-1">
        <header class="page-heading">
            <div>
                <p class="eyebrow" th:text="${kitchen.name}"></p>
                <h1>Kitchen menu</h1>
            </div>
        </header>

        <section class="paper menu-sheet" aria-labelledby="bowls-heading">
            <div class="menu-cover">
                <img th:src="@{/img/default-kitchen-avatar.png}" width="1200" height="800" >
                <div class="menu-category">
                    <h2 id="bowls-heading">Menu</h2>
                    <p th:text="${#lists.size(menuItems) == 1 ? '1 dish' : #lists.size(menuItems) + ' dishes'}"></p>
                </div>
            </div>
            <div class="draft-menu">
                <p class="note" role="alert" th:if="${menuError}" th:text="${menuError}"></p>
                <p class="note" th:if="${#lists.isEmpty(menuItems)}">No dishes yet.</p>
                <details class="dish" th:each="menuItem : ${menuItems}"
                         th:with="editing=${menuItem.id == editItemId}" th:open="${editing}">
                    <summary>
                        <span class="dish-label">
                            <strong th:text="${menuItem.name}"></strong>
                            <span class="badge" th:classappend="${menuItem.available ? 'available' : 'muted'}"
                                  th:text="${menuItem.available ? 'Available' : 'Hidden'}"></span>
                        </span>
                        <span class="dish-price" th:text="|€${#numbers.formatDecimal(menuItem.price, 1, 2)}|"></span>
                        <span class="dish-caret" aria-hidden="true"></span>
                    </summary>

                    <div th:if="${editing}" th:object="${editMenuItemRequest}" role="alert">
                        <ul>
                            <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
                        </ul>
                    </div>

                    <form th:action="@{/kitchen-menu/{id}(id=${menuItem.id})}" method="post">
                        <fieldset class="dish-fields">
                            <legend th:text="|Edit ${menuItem.name}|"></legend>
                            <label class="field">Dish name
                                <input type="text" name="name" maxlength="30" required
                                       th:value="${editing ? editMenuItemRequest.name : menuItem.name}">
                            </label>
                            <label class="field">Price (€)
                                <input type="number" name="price" min="0.01" max="9999.99" step="0.01" required
                                       th:value="${editing ? editMenuItemRequest.price : menuItem.price}">
                            </label>
                            <label class="field">Availability
                                <select name="available" th:with="available=${editing ? editMenuItemRequest.available : menuItem.available}">
                                    <option value="true" th:selected="${available}">Available</option>
                                    <option value="false" th:selected="${!available}">Hidden</option>
                                </select>
                            </label>
                            <button class="dark-button" type="submit">Save changes</button>
                        </fieldset>
                    </form>

                    <form th:action="@{/kitchen-menu/{id}/delete(id=${menuItem.id})}" method="post">
                        <button class="secondary" type="submit">Delete dish</button>
                    </form>
                </details>

                <details class="dish new-dish" open>
                    <summary>Add a dish <span class="dish-caret" aria-hidden="true"></span></summary>

                    <form th:action="@{/kitchen-menu}" th:object="${menuItemRequest}" th:method="post">
                        <fieldset class="dish-fields">
                            <legend>New dish</legend>

                            <label class="field">Dish name
                                <input type="text" th:field="*{name}" maxlength="30" required>
                            </label>
                            <p th:errors="*{name}"></p>

                            <label class="field">Price (€)
                                <input type="number" th:field="*{price}"
                                       min="0.01" max="9999.99" step="0.01" required>
                            </label>
                            <p th:errors="*{price}"></p>

                            <label class="field">Availability
                                <select th:field="*{available}">
                                    <option value="true">Available</option>
                                    <option value="false">Hidden</option>
                                </select>
                            </label>

                            <button type="submit">Save dish</button>
                        </fieldset>
                    </form>
                </details>
            </div>
        </section>
    </main>
</body>
</html>
