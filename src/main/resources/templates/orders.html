<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - capyEats</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<header class="app-header">
    <div class="container">
        <a href="/home" class="logo">capyEats</a>
    </div>
</header>

<main class="profile-main">
    <div class="container">
        <div class="profile-wrapper">
            <!-- Sidebar -->
            <div th:replace="fragments/fragments::profile-sidebar"></div>
            <!-- Main Content -->
            <div class="profile-content">
                <div class="content-header">
                    <h1>Order History</h1>
                </div>

                <div class="orders-list">
                    <div class="order-item" th:each="order : ${orders}">
                        <div class="order-header">
                            <div class="order-info">
                                <div class="order-restaurant">
                                    <img th:src="@{/img/default-kitchen-avatar.png}" height=50 width=50>
                                    <div>
                                        <div class="order-name" th:text="${order.kitchen.name}"></div>
                                        <div class="order-date" th:text="${#temporals.format(order.createdAt, 'MMM dd, yyyy • HH:mm')}"></div>
                                    </div>
                                </div>
                            </div>
                            <div th:if="${order.orderStatus.name() == 'DELIVERED'}" class="order-status delivered">Delivered</div>
                            <div th:if="${order.orderStatus.name() == 'CANCELED'}" class="order-status cancelled">Canceled</div>
                            <div th:if="${order.orderStatus.name() == 'PREPARING'}" class="order-status delivered">Preparing</div>
                            <div th:if="${order.orderStatus.name() == 'CREATED'}" class="order-status delivered">Order placed</div>
                        </div>
                        <div class="order-items">
                            <p th:each="item : ${order.orderItems}"
                               th:text="|${item.quantity} × ${item.name}|"></p>
                        </div>
                        <div class="order-footer">
                            <div class="order-total"
                                 th:text="|Total: €${#numbers.formatDecimal(order.totalPrice, 1, 2)}|">
                            </div>
                            <button class="reorder-btn">Reorder</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
