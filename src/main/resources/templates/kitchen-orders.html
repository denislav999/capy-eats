<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders · Sofia Bowls · capyEats</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/owner.css">
</head>
<body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div th:replace="~{fragments/fragments :: kitchen-header('orders')}"> </div>
    <main id="workspace" class="owner-shell" tabindex="-1">
        <header class="page-heading">
            <div><p class="eyebrow" th:text="|${kitchen.name}|"></p><h1>Orders</h1></div>
        </header>
        <p class="note ticket-note">Sample tickets. Status changes apply only to this page.</p>
        <div class="ticket-grid">
            <article th:each="order : ${orders}" th:with="status=${order.orderStatus.name()}"
                     class="paper order-ticket" th:attr="aria-labelledby=|ticket-${order.id}|">
                <header class="ticket-head">
                    <div>
                        <h2 th:id="|ticket-${order.id}|"
                            th:text="|Order #${#strings.substring(order.id.toString(), 0, 8)}|">
                        </h2>
                        <p>
                            Received at
                            <time th:attr="datetime=${order.createdAt.toString()}"
                                  th:text="${#temporals.format(order.createdAt, 'HH:mm')}">
                            </time>
                        </p>
                    </div>

                    <span class="badge"
                          th:classappend="${status == 'CREATED' ? 'fresh' : (status == 'PREPARING' ? 'progress' : (status == 'DELIVERED' ? 'available' : 'muted'))}"
                          th:text="${status == 'CREATED' ? 'New' : #strings.capitalize(#strings.toLowerCase(status))}"></span>
                </header>
                <details open>
                    <summary>
                        <span>Order items</span>
                        <strong th:text="|€${#numbers.formatDecimal(order.totalPrice, 1, 2)}|"></strong>
                    </summary>

                    <ul class="ticket-items">
                        <li th:each="item : ${order.orderItems}">
                            <span th:text="|${item.quantity} × ${item.name}|"></span>
                            <span th:text="|€${#numbers.formatDecimal(item.totalPrice, 1, 2)}|"></span>
                        </li>
                        <li th:if="${order.deliveryFee != null and order.deliveryFee.signum() > 0}">
                            <span>Delivery fee</span>
                            <span th:text="|€${#numbers.formatDecimal(order.deliveryFee, 1, 2)}|"></span>
                        </li>
                    </ul>
                </details>
                <form class="ticket-status-form" th:if="${status == 'CREATED' or status == 'PREPARING'}"
                      th:action="@{/kitchen-orders/{orderId}/status(orderId=${order.id})}"
                      method="post">
                    <label class="ticket-state">
                        <span>Change status</span>
                        <select name="status" required>
                            <option value="" selected disabled>Choose a status</option>
                            <option th:if="${status == 'CREATED'}" value="PREPARING">Preparing</option>
                            <option th:if="${status == 'PREPARING'}" value="DELIVERED">Delivered · cash collected</option>
                            <option th:if="${status == 'CREATED'}" value="CANCELED">Canceled</option>
                        </select>
                    </label>
                    <button class="dark-button" type="submit">Save status</button>
                </form>
            </article>

        </div>
    </main>
    <footer class="owner-shell preview-note">Owner preview · Sample kitchen data</footer>
</body>
</html>
