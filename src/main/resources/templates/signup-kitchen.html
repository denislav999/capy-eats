<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Signup - capyEats</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/signup.css">
</head>
<body>
<header class="header">
    <div class="container">
        <div class="nav">
            <div class="nav-left">
                <a href="/" class="logo">capyEats</a>
            </div>
        </div>
    </div>
</header>

<main class="signup-main">
    <div class="signup-container">
        <div class="signup-box">
            <h1 class="signup-title">Register your kitchen</h1>
            <p class="signup-subtitle">Create your owner account and submit your kitchen for admin approval.</p>

            <form class="signup-form" th:action="@{/signup-kitchen}"
                  method="post"
                  th:object="${kitchenOwnerRequest}"
                  novalidate>

                <div class="form-group">
                    <label for="kitchen-name" class="form-label">Kitchen Name</label>
                    <input
                            type="text"
                            id="kitchen-name"
                            th:field="*{kitchenName}"
                            class="form-input"
                            placeholder="Enter your kitchen name"
                            maxlength="100"
                            required
                    >
                    <p class="validation-warning" th:errors="*{kitchenName}"></p>
                </div>

                <div class="form-group">
                    <label for="owner-username" class="form-label">Owner Username</label>
                    <input
                            type="text"
                            id="owner-username"
                            th:field="*{username}"
                            class="form-input"
                            placeholder="Choose your login username"
                            autocomplete="username"
                            minlength="6"
                            maxlength="26"
                            required
                    >
                    <p class="validation-warning" th:errors="*{username}"></p>
                </div>

                <div class="form-group">
                    <label for="kitchen-email" class="form-label">Business Email</label>
                    <input
                            type="email"
                            id="kitchen-email"
                            th:field="*{email}"
                            class="form-input"
                            placeholder="Enter your business email"
                            autocomplete="email"
                            maxlength="40"
                            required
                    >
                    <p class="validation-warning" th:errors="*{email}"></p>
                </div>

                <div class="form-group">
                    <label for="kitchen-password" class="form-label">Password</label>
                    <input
                            type="password"
                            id="kitchen-password"
                            name="password"
                            class="form-input"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            maxlength="18"
                            required
                    >
                    <p class="validation-warning" th:errors="*{password}"></p>
                </div>

                <p class="file-hint">Your kitchen must be approved before customers can see it or place orders. Use your owner username to log in.</p>

                <button type="submit" class="btn btn-primary btn-full">Register your kitchen</button>
            </form>

            <p class="login-text">
                Already have an account? <a href="/login" class="login-link">Log in</a>
            </p>
        </div>
    </div>
</main>

</body>
</html>
